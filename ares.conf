# /etc/ares/ares.conf
# ARES Network Scanner Configuration

# [global]
# loki_url  = http://10.8.0.1:3100

# ─── NETWORKS ─────────────────────────────────────────────────────────────────
# Define one [network:name] section per network.
# All defined networks are scanned automatically when no --network CLI arg given.
#
# Options:
#   network   = CIDR notation          (required)
#   interface = network interface       (optional)
#   mode      = arp (L2) or ip (L3)    (default: arp)
#
# mode = arp  → ARP scan, MAC addresses visible. Use for local L2 networks.
# mode = ip   → ping scan, no MAC addresses.  Use for remote/VPN networks.

# Example for a remote network (no MAC visibility)
# [network:remote]
# network   = 172.16.0.0/24
# interface =
# mode      = ip
